services:
  go-server:
    build:
      dockerfile: server.dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - app.env

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml