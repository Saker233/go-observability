apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-server-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: go-observability.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-server
                port:
                  number: 8000

    - host: grafana.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000